<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Verge | Корзина</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex flex-col min-h-screen">
    <header class="p-6 border-b border-gray-800"><a href="catalog.html" class="text-gray-400 hover:text-white">&larr; Продолжить покупки</a></header>
    <main class="flex-grow container mx-auto px-4 py-12 max-w-3xl">
        <h1 class="text-4xl font-black uppercase mb-8">Ваша корзина</h1>
        <div id="cart-container" class="space-y-4 mb-8"></div>
        <div id="cart-actions" class="bg-[#1e1e1e] p-8 rounded-3xl flex justify-between items-center hidden">
            <span class="text-2xl font-bold">Итого: <span id="cart-total" class="text-[#ccff00]">0 ₽</span></span>
            <a href="checkout.html" class="bg-[#ccff00] text-black font-bold py-3 px-8 rounded-xl hover:bg-[#b3e600] transition-colors">Оформить заказ</a>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        function renderCartPage() {
            const cart = getCart();
            const container = document.getElementById('cart-container');
            const actions = document.getElementById('cart-actions');
            
            if (cart.length === 0) {
                container.innerHTML = `<div class="bg-[#1e1e1e] p-12 rounded-3xl text-center text-gray-400">Корзина пуста. Добавьте товары из каталога.</div>`;
                actions.classList.add('hidden');
                return;
            }
            
            actions.classList.remove('hidden');
            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                    <div class="bg-[#1e1e1e] p-6 rounded-2xl flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-lg">${item.name}</h4>
                            <p class="text-sm text-gray-400">${item.quantity} шт. × ${formatPrice(item.price)}</p>
                        </div>
                        <span class="font-black text-xl">${formatPrice(item.price * item.quantity)}</span>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = formatPrice(total);
        }
        renderCartPage();
    </script>
</body>
</html>
