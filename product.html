<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Verge | Товар</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex flex-col min-h-screen">
    <header class="p-6 border-b border-gray-800"><a href="catalog.html" class="text-gray-400 hover:text-white">&larr; Назад в каталог</a></header>
    <main class="flex-grow container mx-auto px-4 py-12 max-w-5xl" id="product-view"></main>
    <script src="js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id')) || 1;
        const product = catalogData.find(p => p.id === productId) || catalogData[0];
        
        document.getElementById('product-view').innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 bg-[#1e1e1e] p-8 md:p-12 rounded-3xl">
                <div class="h-[500px] rounded-2xl overflow-hidden"><img src="${product.image}" class="w-full h-full object-cover"></div>
                <div class="flex flex-col justify-center">
                    <span class="text-xs text-[#ccff00] uppercase font-bold mb-2">${product.category}</span>
                    <h1 class="text-4xl font-black mb-4">${product.name}</h1>
                    <p class="text-3xl font-light mb-8">${formatPrice(product.price)}</p>
                    <p class="text-gray-400 mb-8 leading-relaxed">Премиальные материалы, современный дизайн и идеальная посадка по фигуре.</p>
                    <button onclick="addToCart(${product.id})" class="w-full bg-[#ccff00] text-black font-bold text-lg py-4 rounded-xl hover:bg-[#b3e600] transition-colors">Добавить в корзину</button>
                </div>
            </div>
        `;
    </script>
</body>
</html>
