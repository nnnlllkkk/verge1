<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Verge | Lookbook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex flex-col min-h-screen">
    <header class="p-6 border-b border-gray-800 flex justify-between items-center">
        <a href="index.html" class="text-3xl font-black uppercase">Verge<span class="text-[#ccff00]">.</span></a>
        <a href="cart.html" class="hover:text-[#ccff00]">Корзина</a>
    </header>
    <main class="flex-grow container mx-auto px-4 py-12 max-w-3xl text-center">
        <h1 class="text-4xl font-black uppercase mb-4">Конструктор Lookbook</h1>
        <p class="text-gray-400 mb-8">Создавайте готовые стильные комплекты в один клик.</p>
        <div class="bg-[#1e1e1e] p-8 rounded-3xl mb-8">
            <h3 class="text-2xl font-bold mb-2">Капсула Smart Casual</h3>
            <p class="text-[#ccff00] text-xl font-black mb-6">13 580 ₽</p>
            <button onclick="addToCart(1); addToCart(2); showToast('Образ добавлен в корзину!')" class="w-full bg-[#ccff00] text-black font-bold py-4 rounded-xl hover:bg-[#b3e600] transition-colors">Купить весь образ</button>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
